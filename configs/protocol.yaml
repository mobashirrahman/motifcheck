# ---------------------------------------------------------------------------
# Candidate universe and eligibility
# ---------------------------------------------------------------------------
candidates:
  max_positives: 10000            # amended by A1; realized count is min(10000, n_peaks)
  background_ratio: 4             # 1:4 positive/background, plan section 4.3
  background_exclusion_buffer: 100 # nt each side of ANY replicate-level peak, plan 4.3
  expression_min_tpm: 1.0
  annotation_version: "GENCODE v49"
  context_categories: [intronic, exonic]
  collapse_overlapping_positives: true   # one deterministic representative per locus
  required_bases: ACGT            # N and other IUPAC codes are rejected, not padded
  reject_out_of_bounds: true

# ---------------------------------------------------------------------------
# Leakage control and splitting
# ---------------------------------------------------------------------------
splits:
  fractions: {train: 0.70, validation: 0.15, test: 0.15}
  hash_seed: 20260929
  join_rules: [shared_gene, overlapping_locus, identical_sequence, near_duplicate]
  near_duplicate:
    min_identity: 0.90
    min_coverage_of_shorter: 0.80
    count_reverse_complement: true   # for leakage detection only
    implementation: motifcheck.splits.kmer_jaccard
  giant_component_max_fraction: 0.05
  giant_component_max_loss_fraction: 0.20
  min_train_positives: 2000
  min_train_components: 200
  min_eval_positives: 500
  min_eval_components: 100

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  B0: {kind: constant_prevalence}
  B1: {kind: logistic, features: mono_dinucleotide, expected_params: 21}
  B2: {kind: logistic, features: mono_dinucleotide_context, expected_params: "<50",
       note: "input-coverage feature removed by amendment A2"}
  B3: {kind: logistic, features: kmer_3_4_5_normalized, expected_params: 1345}
  B4: {kind: logistic, features: motif_max_score_and_hits, expected_params: 2}
  C0: {kind: tinycnn, training: standard}
  C1: {kind: tinycnn, training: nuisance_balanced}

tinycnn:
  in_channels: 4
  channels: 32
  conv_stack:
    - {kernel: 11, dilation: 1, padding: 5}
    - {kernel: 5, dilation: 2, padding: 4}
    - {kernel: 5, dilation: 4, padding: 8}
  activation: GELU
  pooling: [mean, max]        # concatenated -> 64 features
  hidden: 32
  dropout: 0.1
  expected_params: 13857
  receptive_field: 35
  normalization_layers: none
  sigmoid_before_loss: false

transformer:
  enabled: false               # H3; only after the core report
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 128
  param_cap: 300000

optimization:
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 128
  epochs: 30
  grad_clip_norm: 1.0
  loss: BCEWithLogitsLoss
  checkpoint_selection: best_validation_ap   # tie-break: lower val log loss, then earlier epoch
  seeds: [17, 29, 43, 71, 101]
  paired_conditions: [C0, C1]
  fallback_lr: 0.0003          # at most one prespecified fallback, same for both arms
  fallback_lr_used: false
  precision: float32

baselines_regularization_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
baselines_selected_by: validation_ap

# ---------------------------------------------------------------------------
# The single intervention: training loss weighting
# ---------------------------------------------------------------------------
intervention:
  strata: [context, gc_quintile, expression_tertile]
  gc_quintile_source: training_only
  expression_tertile_source: training_only
  min_positives_per_stratum: 10
  min_background_per_stratum: 10
  w0: "N / (2 * n_y)"
  w1: "n_s / (2 * n_ys)"
  normalize_to_mean_one: true
  clip_ceiling: 5.0
  clip_before_renormalize: true
  loss_reduction: weighted_mean_global_normalization
  max_revise_attempts: 2
  qc:
    min_effective_sample_size_fraction: 0.50
    max_abs_smd_gc: 0.10
    max_abs_smd_log1p_tpm: 0.10
    max_abs_context_proportion_diff: 0.05
  diagnostic_only: [mono_counts, dinucleotide_counts, gene_length]

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  panels:
    P1: {name: "fixed sampled assay panel", role: primary_predictive}
    P2: {name: "matched diagnostic panel", role: secondary_predictive, ratio: 1.0}
  P2_matching: [context, gc, expression]
  P2_matching_source: training_derived_bins
  metrics: [average_precision, auroc, log_loss, brier]
  primary_metric: average_precision
  report_benchmark_prevalence_on_every_pr_curve: true

motif_audit:
  motif_id: M00249_2.00          # frozen before scoring
  pwm_pseudocount: 0.25
  background_frequencies: {A: 0.25, C: 0.25, G: 0.25, U: 0.25}
  threshold_source: training_null_sequences
  target_fpr_in_training_null: 0.01
  max_windows: 500
  min_components: 100
  max_controls_per_instance: 20
  control_type: mononucleotide_count_and_length_preserving_local_shuffle
  min_controls_per_instance: 5
  tie_tolerance_logit: 1.0e-6
  selection_basis: [label, annotation, motif_score, fixed_hash]
  forbidden_selection_basis: [model_confidence]
  specificity_guard: true
  min_components_for_specificity: 100
  exploratory_if_below: {components: 100, valid_windows: 200}

attribution:
  method: ISM                 # exact in silico mutagenesis is the reference
  substitutions_per_sequence: 603   # 201 positions x 3 alternatives
  panel_size: 64
  panel_strata: "16 per positive/background x motif-present/absent"
  tism:
    enabled: true
    check_split: validation
    min_median_spearman: 0.80
    min_sign_agreement_top10pct: 0.80
    on_failure: retain_exact_ism

statistics:
  unit_of_resampling: leakage_component
  bootstrap_replicates: 2000
  bootstrap_seed: 20260929
  confidence_level: 0.95
  interval_type: percentile
  paired: true

primary_comparison:
  contrast: C1_minus_C0
  requirement_1_predictive_non_inferiority:
    metric: average_precision
    panel: P1
    rule: lower_95ci_delta > -0.02
  requirement_2_improved_motif_preference:
    metric: MPA
    min_point_estimate: 0.10
    rule: lower_95ci_delta > 0
    min_seeds_agreeing: 4
  specificity_guard:
    metric: S
    definition: "MPA_target - MPA_outside"
    rule: lower_95ci_delta_of_S > 0
  joint_rule: all_required_conditions_must_pass

claim_levels:
  - {level: valid_demo, wording: "A reproducible audit of a small PTBP1 peak predictor"}
  - {level: intervention_supported, wording: "Balancing improved motif-order evidence while preserving performance in this benchmark"}
  - {level: generalization_supported, wording: "The finding replicated in the tested additional setting"}
  - {level: mechanism_established, wording: null, note: "Not available from this computational demo alone"}

# ---------------------------------------------------------------------------
# Budget
# ---------------------------------------------------------------------------
budget:
  total_gpu_hours_cap: 24
  source_download_cap_gb: 20
  optional_transformer_after_core_report: true
