# MotifCheck protocol — frozen before any model fitting.
# Derived from MotifCheck_Implementation_Plan.md v1.0 (2026-09-29).
# Deviations from the plan are recorded in `amendments` and are the ONLY
# permitted departures. Any change after G0 must append a new amendment.

protocol_version: "1.0.0"
plan_reference: "MotifCheck_Implementation_Plan.md v1.0 (2026-09-29)"
frozen_at: "2026-09-29"

# ---------------------------------------------------------------------------
# Amendments: documented, justified departures from the plan text.
# ---------------------------------------------------------------------------
amendments:
  - id: A1
    section: "4.3"
    plan_says: "Prefer up to 10,000 positive windows and 40,000 background windows."
    reality: >-
      The released GRCh38 IDR reproducible peak file for ENCSR981WKN contains
      only 7,797 peaks, so 10,000 positives are not obtainable from public data.
    change: >-
      Positives are capped at min(10000, n_reproducible_peaks). Background is
      drawn at 4x the realized positive count, preserving the planned 1:4
      ratio rather than the planned absolute count.
    rationale: "Keeps the prespecified ratio; only the absolute scale is forced."
  - id: A2
    section: "4.1 / 6 / 4.3"
    plan_says: >-
      "The associated size-matched input/control metadata and usable processed
      control signal when available" and baseline B2 uses "eligible
      input-coverage features"; background may be restricted by "processed
      input coverage".
    reality: >-
      ENCSR981WKN releases alignments, signal bigWigs, peaks and fastq only.
      No processed size-matched input/control bigWig is released for this
      experiment, and no control experiment is linked from its files.
    change: >-
      The input-coverage feature is dropped from baseline B2 and the
      input-coverage observability filter is disabled. Input signal is recorded
      as an explicitly unavailable column in the data card. B2 therefore uses
      context + log1p TPM only, and is relabelled accordingly.
    rationale: >-
      Plan section 4.1 forbids treating an absent input file as zero coverage.
      Encoding a missing control as a zero-valued feature would be exactly that
      prohibited substitution, so the feature is removed rather than faked.
  - id: A3
    section: "4.1 / 8.2"
    plan_says: "An experimentally determined human PTBP1 motif from CisBP-RNA."
    reality: >-
      cisbp.org/rna redirects to cisbp-rna.ccbr.utoronto.ca, a PHP application
      with no REST API. The documented endpoints all return HTTP 404. The PWM
      files are reachable only through the web application.
    change: >-
      Motifs are fetched from the CisBP-RNA build 2.00 PWM file directory, with
      motif id, study, assay type and Direct/Inferred status recorded verbatim
      in the source manifest. Primary motif is fixed before scoring.
    rationale: "Provenance is preserved; only the transport mechanism differs."
  - id: A4
    section: "4.1"
    plan_says: "Use GRCh38 sequence and gene annotation on the same assembly; public K562 RNA-seq gene quantification for the observable candidate universe."
    reality: >-
      GENCODE v49 annotation and an ENCODE K562 RSEM transcript quantification
      are used. These are the versions available and are pinned by checksum.
    change: >-
      Annotation is GENCODE v49 basic protein-coding on GRCh38. Expression is
      the pinned ENCODE K562 RSEM quantification listed in the manifest.
    rationale: "Single assembly is maintained; versions are pinned and recorded."
  - id: A5
    section: "7 / 10 / 13"
    plan_says: >-
      "If thresholds fail, revise strata/weights on training data only, with at
      most two documented attempts. Otherwise conclude that the balancing
      intervention could not be instantiated as planned. Continue an
      observational audit if useful, but do not label it a successful balancing
      experiment."
    reality: >-
      This rule was written before any model was trained, on training data only.
      It is recorded here so that how an intervention-instantiation failure is
      handled cannot be decided after seeing a test result.
    change: >-
      G5 balance thresholds are a scientific instantiation check, not a
      correctness check. If they fail after the permitted attempts: G5 is
      recorded as "fail" with the exact failing check; the workflow continues
      the observational audit; the C1-minus-C0 comparison is reported as an
      UNDER-BALANCED intervention and never as a successful balancing
      experiment; and the claim level is capped at "valid_demo" regardless of
      the other outcomes. Execution-blocking correctness gates are G0-G4 and G6.
    rationale: >-
      G0-G4 certify that the pipeline computes what it claims to compute. G5
      certifies that the intervention achieved its target balance, which is a
      property of the data as much as of the method. Blocking the whole study
      on it would discard a valid audit; reporting it as a successful
      intervention would be a false claim.


# ---------------------------------------------------------------------------
# Task definition
# ---------------------------------------------------------------------------
task:
  rbp: PTBP1
  cell_type: K562
  assay: eCLIP
  encode_experiment: ENCSR981WKN
  assembly: GRCh38
  unit: "contiguous genomic window"
  window_length: 201
  anchor: "retained reproducible peak midpoint"
  orientation: >-
    Windows on the negative genomic strand are reverse-complemented before the
    single T-to-U conversion. RNA binding is directional, so no reverse-
    complement augmentation is applied.
  label: "1 = observed reproducible PTBP1 peak, 0 = sampled eligible background"
  background_semantics: >-
    Not detected by this assay under these rules. Not proven unbound RNA.

